# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  pull_request_review:
    types: [edited, submitted, dismissed]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        # Node 18.x dropped from the matrix: vite@8/rolldown require `^20.19.0 || >=22.12.0`
        # (they import `styleText` from `node:util`, added in Node 20.12/21.7 and never
        # backported to 18.x) — `npx vite build` hard-crashes on Node 18 with a SyntaxError.

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run lint
    - run: npm run typecheck
    - run: npm run build --if-present
    - name: Build the client (tests/api/*.test.ts calls createApp() directly, which 503s until dist/ exists)
      run: npx vite build
    - run: npm run test
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
    - run: npm run test:e2e
    - name: Upload Playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ matrix.node-version }}
        path: |
          playwright-report/
          test-results/
        retention-days: 7
